name: workassist

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_SSL_CA_PATH: /run/secrets/aws-rds-global-bundle.pem
    expose:
      - "8000"
    volumes:
      - ./certs/global-bundle.pem:/run/secrets/aws-rds-global-bundle.pem:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - private

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    expose:
      - "8501"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - private

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONFIG_FILE:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/nginx-health
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - private

networks:
  private:
    name: workassist-private
    driver: bridge
