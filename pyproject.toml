[project]
name = "docuverse"
version = "0.1.0"
description = "Enterprise-style document search and RAG application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40.0",
    "docx2txt>=0.9",
    "fastapi>=0.115.0",
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    "langchain-groq>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-pinecone>=0.2.0",
    "langchain-text-splitters>=0.3.9",
    "pinecone>=7.3.0",
    "pypdf>=5.9.0",
    "python-dotenv>=1.1.1",
    "pydantic-settings>=2.10.0",
    "requests>=2.32.0",
    "streamlit>=1.48.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv-validation"]

[tool.pytest.ini_options]
pythonpath = ["."]
